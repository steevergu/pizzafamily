<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L'application Pizza Family — Téléchargez-la</title>
<meta name="description" content="Téléchargez l'application Pizza Family sur l'App Store ou Google Play : commandez, cumulez des points fidélité et trouvez le distributeur le plus proche.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;0,9..40,800;1,9..40,700;1,9..40,800&display=swap" rel="stylesheet">
<style>
:root {
  --red:         #FF1F1F;
  --green-deep:  #191919;
  --green-500:   #4C823D;
  --cream:       #F5F5F2;
  --ink:         #191919;
  --ink-70:      rgba(25,25,25,.7);
  --white:       #FFFFFF;
  --font-d: 'Luckiest Guy', system-ui, sans-serif;
  --font-b: 'DM Sans', system-ui, sans-serif;
}
* , *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-b);
  color: var(--ink);
  background: var(--cream);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
img { display: block; max-width: 100%; }
a { text-decoration: none; color: inherit; }
button { font-family: var(--font-b); cursor: pointer; }

/* ---- HERO ---- */
.app-hero {
  position: relative;
  min-height: 100dvh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  padding: 48px 24px 40px;
  overflow: hidden;
  background: linear-gradient(160deg, #ff5f4a 0%, #FF1F1F 45%, #b40e0e 100%);
}
.app-hero::before {
  content: '';
  position: absolute; inset: 0;
  background-image: radial-gradient(120% 60% at 50% 0%, rgba(255,255,255,.30) 0%, transparent 65%);
}
.deco-float {
  position: absolute;
  animation: emojiBob 6s ease-in-out infinite;
  pointer-events: none;
}
@keyframes emojiBob {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-12px); }
}
.app-hero .deco-emoji {
  display: inline-block;
  font-size: 42px; opacity: .38;
  filter: drop-shadow(0 6px 10px rgba(0,0,0,.25));
  will-change: transform;
}
.deco-float.e1 { top: 6%;  left: 7%; }
.deco-float.e2 { top: 12%; right: 9%; }
.deco-float.e3 { bottom: 9%;  left: 9%; }
.deco-float.e4 { bottom: 14%; right: 7%; }
.deco-float.e5 { top: 44%; left: 3%; }
.deco-float.e6 { top: 38%; right: 3%; }
.deco-float.e7 { top: 26%; left: 16%; }
.deco-float.e8 { bottom: 30%; right: 18%; }
.deco-float.e9 { top: 4%;  left: 42%; }
.deco-float.e10 { bottom: 4%; right: 40%; }
.deco-float.e11 { top: 58%; left: 22%; }
.deco-float.e12 { top: 62%; right: 22%; }
.deco-float.e1 { animation-delay: 0s; }
.deco-float.e2 { animation-delay: .8s; }
.deco-float.e3 { animation-delay: 1.6s; }
.deco-float.e4 { animation-delay: 2.4s; }
.deco-float.e5 { animation-delay: .4s; }
.deco-float.e6 { animation-delay: 1.2s; }
.deco-float.e7 { animation-delay: 2s; }
.deco-float.e8 { animation-delay: 2.8s; }
.deco-float.e9 { animation-delay: .6s; }
.deco-float.e10 { animation-delay: 1.4s; }
.deco-float.e11 { animation-delay: 2.2s; }
.deco-float.e12 { animation-delay: 3s; }
.app-hero > *:not(.deco-float) { position: relative; z-index: 2; }

.app-logo-wrap {
  width: 96px; height: 96px; border-radius: 26px;
  background: var(--white);
  box-shadow: 0 12px 32px rgba(0,0,0,.35);
  display: flex; align-items: center; justify-content: center;
  padding: 12px;
  margin-bottom: 22px;
}
.app-logo {
  width: 100%; height: 100%;
  object-fit: contain;
}

.app-title {
  font-family: var(--font-b); font-weight: 800; font-style: italic;
  font-size: clamp(28px, 7.5vw, 44px); line-height: 1.08;
  color: var(--white);
  margin-bottom: 16px;
  width: 100%;
  max-width: 420px;
}

.app-sub {
  font-size: 15px; color: rgba(255,255,255,.75);
  max-width: 340px;
  margin: 0 auto 34px;
  line-height: 1.6;
}

/* ---- BADGES ---- */
.store-badges {
  display: flex; flex-direction: column; align-items: center;
  gap: 14px;
  margin-bottom: 18px;
  width: 100%;
}
.store-badge {
  display: block;
  width: min(168px, 60vw);
  line-height: 0;
  transition: transform .15s;
}
.store-badge:hover { transform: translateY(-2px); }
.store-badge:active { transform: scale(.97); }
.store-badge img { display: block; width: 100%; height: auto; }

.app-toast {
  position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
  background: var(--white); color: var(--ink);
  font-size: 14px; font-weight: 700;
  padding: 14px 22px; border-radius: 999px;
  box-shadow: 0 12px 30px rgba(0,0,0,.25);
  opacity: 0; pointer-events: none;
  transition: opacity .25s ease, transform .25s ease;
  z-index: 50;
  white-space: nowrap;
}
.app-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (min-width: 640px) {
  .store-badges { flex-direction: row; justify-content: center; }
}
</style>
</head>
<body>

<section class="app-hero">
  <span class="deco-float e1" aria-hidden="true"><span class="deco-emoji" style="font-size:56px; transform:rotate(-18deg);">🍕</span></span>
  <span class="deco-float e2" aria-hidden="true"><span class="deco-emoji" style="font-size:36px; transform:rotate(12deg);">🍅</span></span>
  <span class="deco-float e3" aria-hidden="true"><span class="deco-emoji" style="font-size:48px; transform:rotate(10deg);">🍕</span></span>
  <span class="deco-float e4" aria-hidden="true"><span class="deco-emoji" style="font-size:62px; transform:rotate(-10deg);">🍕</span></span>
  <span class="deco-float e5" aria-hidden="true"><span class="deco-emoji" style="font-size:32px; transform:rotate(-25deg);">🫒</span></span>
  <span class="deco-float e6" aria-hidden="true"><span class="deco-emoji" style="font-size:32px; transform:rotate(20deg);">🍄</span></span>
  <span class="deco-float e7" aria-hidden="true"><span class="deco-emoji" style="font-size:28px; transform:rotate(8deg);">🫒</span></span>
  <span class="deco-float e8" aria-hidden="true"><span class="deco-emoji" style="font-size:34px; transform:rotate(-14deg);">🍅</span></span>
  <span class="deco-float e9" aria-hidden="true"><span class="deco-emoji" style="font-size:26px; transform:rotate(16deg);">🍄</span></span>
  <span class="deco-float e10" aria-hidden="true"><span class="deco-emoji" style="font-size:44px; transform:rotate(-8deg);">🍕</span></span>
  <span class="deco-float e11" aria-hidden="true"><span class="deco-emoji" style="font-size:28px; transform:rotate(22deg);">🫒</span></span>
  <span class="deco-float e12" aria-hidden="true"><span class="deco-emoji" style="font-size:30px; transform:rotate(-16deg);">🍅</span></span>
  <div class="app-logo-wrap">
    <img class="app-logo" src="img/logo.png" alt="Pizza Family">
  </div>
  <h1 class="app-title">L'appli Pizza Family</h1>
  <p class="app-sub">Commande en 1 clic, cumule des points fidélité et repère le distributeur le plus proche. Disponible sur iPhone et Android.</p>

  <div class="store-badges">
    <a href="#" class="store-badge" data-store="apple" aria-label="Télécharger sur l'App Store — bientôt disponible">
      <img src="img/bouton-appstore.png" alt="Télécharger sur l'App Store">
    </a>
    <a href="#" class="store-badge" data-store="google" aria-label="Disponible sur Google Play — bientôt disponible">
      <img src="img/bouton-googleplay.png" alt="Disponible sur Google Play">
    </a>
  </div>
</section>

<div class="app-toast" id="toast">L'application arrive très bientôt 🍕</div>

<script>
document.querySelectorAll('.store-badge').forEach(function (btn) {
  btn.addEventListener('click', function (e) {
    e.preventDefault();
    var toast = document.getElementById('toast');
    toast.classList.add('show');
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(function () {
      toast.classList.remove('show');
    }, 2200);
  });
});
</script>

</body>
</html>
